<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>천국의 비밀 계시</title>

  <!-- 캐시 제어 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- SEO / SNS -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="천국의 비밀 계시">
  <meta property="og:description" content="인봉된 성경의 비밀을 보혜사의 계시로 밝히 드러내는 진리 말씀">
  <meta property="og:image" content="https://img.icons8.com/fluency/512/holy-bible.png">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111621">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="천국의비밀">

  <!-- Icons -->
  <link rel="icon" href="https://img.icons8.com/fluency/512/holy-bible.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/holy-bible.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (Pages OK) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1754cf'
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111621;
      z-index: 9999;
      transition: opacity .5s;
    }

    #app {
      opacity: 0;
      transition: opacity .4s;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    #app.ready {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Splash -->
  <div id="splash">
    <img src="https://img.icons8.com/fluency/512/holy-bible.png" width="120">
    <h1 class="mt-4 text-white text-xl font-bold">천국의 비밀 계시</h1>
  </div>

  <!-- App -->
  <div id="app">
    <div class="text-center">
      <h2 class="text-2xl font-bold mb-2">진리의 말씀</h2>
      <p class="opacity-80">보혜사의 계시로 밝히 드러나는 인봉된 성경</p>
    </div>
  </div>

  <script>
    // 줌 방지
    document.addEventListener('touchstart', e => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // Splash 제거
    setTimeout(() => {
      document.getElementById('splash').style.opacity = '0';
      document.getElementById('app').classList.add('ready');
      setTimeout(() => document.getElementById('splash').remove(), 500);
    }, 2500);

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
